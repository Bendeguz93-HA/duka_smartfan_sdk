[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duka_smartfan_sdk"
version = "0.2.1"
description = "Duka Smartfan Wifi ventilation SDK"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
authors = [
    { name = "Jens Østergaard Nielsen" },
    { name = "Søren Howe Gersager" },
]

[project.urls]
Homepage = "https://github.com/syre/duka_smartfan_sdk"
Repository = "https://github.com/syre/duka_smartfan_sdk"
Issues = "https://github.com/syre/duka_smartfan_sdk/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
]

[tool.setuptools.package-data]
duka_smartfan_sdk = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["duka_smartfan_sdk"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
files = ["duka_smartfan_sdk"]
python_version = "3.12"
strict = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
